# Dependabot configuration installed into target repos by bootstrap.sh.
# Ecosystems are listed unconditionally; Dependabot ignores a directory that
# has no manifest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/node"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
